# `make up` brings the stack up. Kafka runs in KRaft mode (no ZooKeeper).
# Containers reach Kafka at kafka:9092; the host reaches it at localhost:29092.
services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: uplift
      POSTGRES_PASSWORD: uplift
      POSTGRES_DB: uplift
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uplift -d uplift"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ARTIFACTS_DIR: /app/models
      POLICY_PATH: /app/docs/policy_results.json
    volumes:
      - ./models:/app/models:ro
      - ./docs:/app/docs:ro

  scorer:
    build: .
    command: python -m streaming.scorer --artifacts-dir /app/models --bootstrap-servers kafka:9092 --postgres-dsn postgresql://uplift:uplift@postgres:5432/uplift
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./models:/app/models:ro

  app:
    build: .
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DOCS_DIR: /app/docs
    volumes:
      - ./docs:/app/docs:ro

  # One-off batch tooling (ETL, training, tests). Run: docker compose run --rm batch <command>
  batch:
    build:
      context: .
      dockerfile: Dockerfile.batch
    profiles: ["batch"]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      KAFKA: kafka:9092

volumes:
  mlflow-data:
